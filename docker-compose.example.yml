# Example compose for Traefik + Hostinger hstgr.cloud reverse proxy.
# Copy to docker-compose.yml and adjust hostname / secrets as needed.
services:
  listing-manager:
    build: .
    restart: unless-stopped
    environment:
      N8N_DRAFT_WEBHOOK_URL: ${N8N_DRAFT_WEBHOOK_URL:-}
      PUBLISH_WORKER_URL: ${PUBLISH_WORKER_URL:-}
      N8N_PUBLISH_WEBHOOK_URL: ${N8N_PUBLISH_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://listing-manager.srv1581423.hstgr.cloud}
      SELLER_POSTCODE: ${SELLER_POSTCODE:-DA3 7PS}
    volumes:
      - listing_manager_data:/app/data
    networks:
      - default
      - proxy
      - n8n_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok||r.status===307||r.status===308?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.listing-manager.rule=Host(`listing-manager.srv1581423.hstgr.cloud`)
      - traefik.http.routers.listing-manager.entrypoints=websecure
      - traefik.http.routers.listing-manager.tls.certresolver=letsencrypt
      - traefik.http.services.listing-manager.loadbalancer.server.port=3000
      - traefik.http.routers.listing-manager-http.rule=Host(`listing-manager.srv1581423.hstgr.cloud`)
      - traefik.http.routers.listing-manager-http.entrypoints=web
      - traefik.http.routers.listing-manager-http.middlewares=listing-manager-https
      - traefik.http.middlewares.listing-manager-https.redirectscheme.scheme=https
      - traefik.http.middlewares.listing-manager-https.redirectscheme.permanent=true

volumes:
  listing_manager_data:

networks:
  proxy:
    external: true
  n8n_net:
    external: true
    name: n8n-with-ai-assistant-mqko_default
